[package]
name = "orx-concurrent-recursive-iter"
version = "2.0.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
description = "A concurrent iterator that can be extended recursively by each of its items."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-concurrent-iter/"
keywords = ["concurrency", "iterator", "iteration", "recursive", "parallelism"]
categories = ["data-structures", "concurrency", "rust-patterns", "no-std"]

[dependencies]
orx-concurrent-queue = { path = "../orx-concurrent-queue", default-features = false }
crossbeam-deque = { version = "0.8.6", default-features = false, optional = true }
crossbeam-queue = { version = "0.3.12", default-features = false }
orx-concurrent-iter = { git = "https://github.com/orxfun/orx-concurrent-iter/", branch = "v4" }
orx-pinned-vec = { version = "3.21.0", default-features = false }
orx-split-vec = { version = "3.22.0", default-features = false }
orx-fixed-vec = { version = "3.22.0", default-features = false }
orx-pseudo-default = { version = "2.1.0", default-features = false }

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }
criterion = { version = "0.8.0", default-features = false }
enum-iterator = { version = "2.3.0", default-features = false }
orx-concurrent-bag = { version = "3.4.0" }
orx-criterion = { git = "https://github.com/orxfun/orx-criterion" }
rayon = { version = "1.11.0" }
rand_chacha = { version = "0.9.0" }
rand = { version = "0.9.2" }
test-case = { version = "3.3.1" }

[features]
default = ["std"]
std = ["dep:crossbeam-deque"]

# benchmarks

[[bench]]
name = "ben"
harness = false
