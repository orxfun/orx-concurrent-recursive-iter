[package]
name = "orx-concurrent-recursive-iter"
version = "3.0.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
description = "A concurrent iterator that can be extended recursively by each of its items."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-concurrent-recursive-iter/"
keywords = ["concurrency", "iterator", "iteration", "recursive", "parallelism"]
categories = ["data-structures", "concurrency", "rust-patterns", "no-std"]

[dependencies]
crossbeam-deque = { version = "0.8.6", default-features = false, optional = true, features = [
    "std",
] }
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
] }
orx-concurrent-iter = { git = "https://github.com/orxfun/orx-concurrent-iter/", branch = "v4" }
orx-pseudo-default = { version = "2.1.0", default-features = false, optional = true }
orx-pinned-vec = { git = "https://github.com/orxfun/orx-pinned-vec", branch = "v4", default-features = false, optional = true }
orx-fixed-vec = { git = "https://github.com/orxfun/orx-fixed-vec", branch = "v4", default-features = false, optional = true }
orx-split-vec = { git = "https://github.com/orxfun/orx-split-vec", branch = "v4", default-features = false, optional = true }
orx-concurrent-queue = { git = "https://github.com/orxfun/orx-concurrent-queue", branch = "v2", default-features = false, optional = true }

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }
criterion = { version = "0.8.0", default-features = false }
enum-iterator = { version = "2.3.0", default-features = false }
orx-concurrent-bag = { git = "https://github.com/orxfun/orx-concurrent-bag", branch = "v4", default-features = false }
orx-criterion = { git = "https://github.com/orxfun/orx-criterion" }
rayon = { version = "1.11.0" }
rand_chacha = { version = "0.9.0" }
rand = { version = "0.9.2" }
test-case = { version = "3.3.1" }

[features]
default = ["std"]
std = ["dep:crossbeam-deque"]
experimental = [
    "dep:orx-pseudo-default",
    "dep:orx-pinned-vec",
    "dep:orx-split-vec",
    "dep:orx-fixed-vec",
    "dep:orx-concurrent-queue",
]

# benchmarks

[[bench]]
name = "reduction"
harness = false
